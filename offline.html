<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1324" />
  <title>Calypço – Hors connexion</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/app-v2.css" />
</head>
<body class="auth-page">
  <main class="offline-main">
    <section class="card offline-card">
      <img src="assets/icons/calypso.svg" alt="" width="88" height="88" />
      <p class="eyebrow">Connexion requise</p>
      <h1>Calypço est hors connexion</h1>
      <p>
        Pour éviter les doublons et protéger les ventes, les validations de billets et
        les opérations de caisse nécessitent une connexion à Internet.
      </p>
      <button class="btn-primary" type="button" onclick="window.location.reload()">
        Réessayer
      </button>
    </section>
  </main>
