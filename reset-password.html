<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1324" />
  <title>Calypço – Nouveau mot de passe</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icons/calypso.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icons/calypso-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/app-v2.css" />
</head>
<body class="auth-page">
  <header>
    <div class="header-inner">
      <img class="brand-logo" src="assets/icons/calypso.svg" alt="" width="52" height="52" />
      <div>
        <h1>Nouveau mot de passe</h1>
        <p>Sécurisez votre compte professionnel Calypço.</p>
      </div>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>Choisir un mot de passe</h2>

      <div class="form-row">
        <label for="newPassword">Mot de passe</label>
        <input
          id="newPassword"
          type="password"
          minlength="8"
          autocomplete="new-password"
        />
      </div>

      <div class="form-row">
        <label for="newPasswordConfirm">Confirmer le mot de passe</label>
        <input
          id="newPasswordConfirm"
          type="password"
          minlength="8"
          autocomplete="new-password"
        />
      </div>

      <button id="btnResetPassword" class="btn-primary" type="button">
        Enregistrer le mot de passe
      </button>

      <p id="resetMessage" class="message" style="display:none;"></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.0"></script>
  <script src="js/appwrite-config.js?v=1"></script>
  <script src="js/appwrite-client.js?v=1"></script>
  <script src="js/reset-password.js?v=1"></script>
  <script src="js/pwa.js?v=1"></script>
</body>
</html>
